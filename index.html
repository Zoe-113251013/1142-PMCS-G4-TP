        // We keep a ref to the resume interval so we can clear it when speech ends.
        const _speechResumeInterval = { current: null };
        function startSpeechResumeTimer() {
            clearInterval(_speechResumeInterval.current);
            _speechResumeInterval.current = setInterval(() => {
                if (window.speechSynthesis && window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
                    window.speechSynthesis.pause();
                    window.speechSynthesis.resume();
                }
            }, 10000);
        }
        function stopSpeechResumeTimer() {
            clearInterval(_speechResumeInterval.current);
            _speechResumeInterval.current = null;
        }

                    ref.current.innerHTML = '';
                    const svg = window.lucide.createElement(window.lucide.icons[name]);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    ref.current.appendChild(svg);
                }
            }, [name, size]);
            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`}></span>;

                        { value: 'A', label: '2+ years of Digital PM experience, or a solid foundation in large-scale retail buying or merchandise planning, with Agile familiarity.', icon: '🌿' },
                        { value: 'B', label: '3–5+ years of hands-on experience in CPG or fashion retail, specializing in Product Marketing or brand management.', icon: '🌳' },
                    ]
                },
                {
                    id: 'q8_salary',
                    question: 'Q8 [Salary Expectations] Regarding compensation, which structure fits your next role better?',
                    options: [
                        { value: 'A', label: 'Accept a median ~$90,000/yr (Senior: $137,000+), valuing the company-wide profit-sharing plan (HIP) and strong work-life balance.', icon: '⚖️' },
                        { value: 'B', label: 'Target a solid $110,000–$135,000 base, with ambition to earn a substantial annual performance bonus through strong execution and market results.', icon: '🏆' },

                },
            ];

            const handleSelect = async (questionId, value) => {
                const newAnswers = { ...answers, [questionId]: value };
                setAnswers(newAnswers);

                if (step < questions.length - 1) {
                    setStep(step + 1);
                } else {
                    // All questions answered — call AI
                    await runAIAnalysis(newAnswers);
                }
            };

            const runAIAnalysis = async (finalAnswers) => {
                setAiLoading(true);
                setAiResult(null);

                // Count A vs B answers
                const values = Object.values(finalAnswers);
                const aCount = values.filter(v => v === 'A').length;
                const bCount = values.filter(v => v === 'B').length;
                const isHM = aCount >= bCount;
                const zh = lang === 'zh';

                // Small delay to show loading animation
                await new Promise(r => setTimeout(r, 900));

                let result;
                if (zh) {
                    if (isHM) {
                        result = `1. 🎯 **推薦職缺：H&M 數位產品經理**\n你的作答結果顯示 A（${aCount} 票）多於 B（${bCount} 票），整體偏向 H&M 數位產品經理職位。\n\n2. 📊 **契合度分析**\n你偏好以數據與 A/B 測試驅動決策，擅長以產品路線圖（Roadmap）拆解複雜專案，善用「無職權領導力」協調跨職能團隊，並能在敏捷（Agile）環境中快速調整優先順序。這些特質與 H&M 對數位 PM 的期待高度吻合。\n\n3. 💡 **申請建議**\n① 準備 1–2 個端對端產品管理的具體案例，清楚描述你如何運用數據推動產品迭代。\n② 展示你對敏捷/Scrum 的實戰經驗，包含衝刺規劃與 OKR 追蹤。\n③ 透過 H&M 人才社群提交履歷，主動關注 Digital Tech 部門的最新職缺。\n\n4. ⚠️ **注意事項**\n① H&M 重視全球視野，建議補充跨文化溝通或跨國專案協作的經驗。\n② 薪資中位數約 $90,000，若期望更高薪酬，可朝資深 PM（$137,000+）方向規劃職涯發展。`;
                    } else {
                        result = `1. 🎯 **推薦職缺：Uniqlo 產品行銷經理**\n你的作答結果顯示 B（${bCount} 票）多於 A（${aCount} 票），整體偏向 Uniqlo 產品行銷經理職位。\n\n2. 📊 **契合度分析**\n你具備強烈的商業敏感度與品牌敘事能力，擅長擔任跨部門核心樞紐，熱衷探索流行文化並將其轉化為 GTM 策略，且能在高壓的跨國矩陣環境中展現韌性。這些特質與 Uniqlo 產品行銷經理的職能需求非常吻合。\n\n3. 💡 **申請建議**\n① 準備針對北美市場的 GTM 策略案例，清楚說明如何整合行銷、公關與商品規劃資源。\n② 展示你對 LifeWear 哲學與 UT 聯名系列的品牌理解，表達與 Uniqlo 文化的高度契合。\n③ 強調 3–5 年以上的品牌管理實戰背景，並突出大型跨國活動的執行成果。\n\n4. ⚠️ **注意事項**\n① 此職位主要在紐約曼哈頓辦公，遠端彈性相對有限，需確認工作地點的接受度。\n② 建議加強數位行銷數據分析能力，以補充傳統品牌管理背景的不足。`;
                    }
                } else {
                    if (isHM) {
                        result = `1. 🎯 **Recommended Role: H&M Digital Product Manager**\nYour results show ${aCount} A answers vs ${bCount} B answers, pointing strongly toward the H&M Digital Product Manager role.\n\n2. 📊 **Fit Analysis**\nYou favour data-driven decisions and A/B testing, excel at breaking complex projects into Agile sprints with clear Roadmaps and OKR tracking, and naturally lead cross-functional teams through influence rather than authority. These traits align precisely with what H&M looks for in a Digital PM.\n\n3. 💡 **Application Tips**\n① Prepare 1–2 end-to-end product management case studies that clearly show how you used data to drive iteration.\n② Highlight hands-on Agile/Scrum experience including sprint planning and KPI tracking.\n③ Submit your profile via the H&M Talent Community and watch the Digital Tech department for openings.\n\n4. ⚠️ **Watch Out For**\n① H&M values a global mindset — strengthen examples of cross-cultural collaboration or international project work.\n② The median salary is ~$90,000; if you have higher expectations, plan a trajectory toward Senior PM roles ($137,000+).`;
                    } else {
                        result = `1. 🎯 **Recommended Role: Uniqlo Product Marketing Manager**\nYour results show ${bCount} B answers vs ${aCount} A answers, pointing strongly toward the Uniqlo Product Marketing Manager role.\n\n2. 📊 **Fit Analysis**\nYou bring sharp business acumen and brand storytelling instincts, thrive as a cross-functional hub connecting creative, PR, and merchandising teams, and are energised by turning pop-culture insights into compelling GTM strategies. Your resilience under pressure fits Uniqlo's fast-paced, matrix-style environment perfectly.\n\n3. 💡 **Application Tips**\n① Prepare a North-America-focused GTM case study that shows how you've unified marketing, PR, and product planning resources.\n② Demonstrate your understanding of LifeWear philosophy and UT collaborations to show cultural alignment with Uniqlo.\n③ Highlight 3–5+ years of brand management experience and quantify the impact of major campaign launches.\n\n4. ⚠️ **Watch Out For**\n① This role is primarily on-site in Manhattan — confirm you're comfortable with the location before applying.\n② Consider strengthening your digital marketing analytics skills to complement your brand management background.`;
                    }
                }

                setAiResult(result);
                setAiLoading(false);
            };

            const reset = () => {
                setStep(0);
                setAnswers({});
                setAiResult(null);
                setAiLoading(false);

            const zh = lang === 'zh';
            const progress = Math.round(((step) / questions.length) * 100);

            // Format AI result with markdown-like rendering
            const renderAiText = (text) => {

                        {/* Result View */}
                        {aiResult && (
                            <div className="animate-in fade-in duration-500">

                                    </div>
                                    <div className="space-y-1">{renderAiText(aiResult)}</div>

                                    <h3 className="font-semibold text-gray-800 dark:text-gray-200 mb-3 text-sm">{zh ? '📋 直接查看職缺詳情' : '📋 View Full Job Postings'}</h3>
                                    <div className="flex gap-3">
                                        <button
                                            onClick={() => navigateTo('app', { id: 'jobs', title: zh ? '職缺資料' : 'Job Openings', subtitle: zh ? '招募中職缺' : 'Active Positions', icon: Briefcase, color: 'text-[#e50010]', type: 'placeholder' })}
                                            className="flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-[#e50010] hover:bg-red-700 text-white text-sm font-semibold transition-colors shadow"
                                        >
                                            <Briefcase size={16} />
                                            {zh ? '查看職缺比較' : 'Compare Both Jobs'}
                                        </button>
                                    </div>
                                </div>

                                <button onClick={reset} className="w-full py-3 rounded-xl border-2 border-purple-300 dark:border-purple-700 text-purple-600 dark:text-purple-400 font-semibold text-sm hover:bg-purple-50 dark:hover:bg-purple-900/20 transition-colors">
                                    {zh ? '🔄 重新測驗' : '🔄 Start Over'}
                                </button>
                            </div>
                        )}

                        {/* Loading */}
                        {aiLoading && (
                            <div className="text-center py-16">
                                <div className="inline-block w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center mx-auto mb-6 shadow-lg animate-pulse">
                                    <Wand2 size={28} className="text-white" />
                                </div>
                                <p className="text-gray-700 dark:text-gray-300 font-semibold text-lg">{zh ? 'AI 正在分析你的職涯偏好…' : 'AI is analyzing your career profile…'}</p>
                                <p className="text-gray-400 text-sm mt-2">{zh ? '這通常只需要幾秒鐘' : 'This usually takes just a few seconds'}</p>
                                <div className="flex justify-center gap-1 mt-6">
                                    {[0,1,2].map(i => (
                                        <div key={i} className="w-2 h-2 rounded-full bg-purple-400 animate-bounce" style={{ animationDelay: `${i * 0.15}s` }} />
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Quiz */}
                        {!aiLoading && !aiResult && (
                            <div>
                                {/* Progress */}
                                <div className="mb-6">
                                    <div className="flex justify-between text-xs text-gray-500 dark:text-gray-400 mb-2">
                                        <span>{zh ? `問題 ${step + 1} / ${questions.length}` : `Question ${step + 1} of ${questions.length}`}</span>
                                        <span>{progress}%</span>
                                    </div>
                                    <div className="h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-purple-500 to-indigo-500 rounded-full transition-all duration-500" style={{ width: `${progress}%` }} />
                                    </div>
                                </div>

                                {/* Question Card */}
                                <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 p-6 mb-4">
                                    <h2 className="text-lg font-bold text-gray-900 dark:text-white mb-6">{questions[step].question}</h2>
                                    <div className="space-y-3">
                                        {questions[step].options.map(opt => (
                                            <button
                                                key={opt.value}
                                                onClick={() => handleSelect(questions[step].id, opt.value)}
                                                className="w-full flex items-center gap-4 p-4 rounded-xl border-2 border-gray-100 dark:border-gray-700 hover:border-purple-400 hover:bg-purple-50 dark:hover:bg-purple-900/20 dark:hover:border-purple-600 transition-all group text-left"
                                            >
                                                <span className="text-2xl">{opt.icon}</span>
                                                <span className="font-medium text-gray-800 dark:text-gray-200 group-hover:text-purple-700 dark:group-hover:text-purple-300">{opt.label}</span>
                                                <ChevronRight size={16} className="ml-auto text-gray-300 group-hover:text-purple-400" />
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Back button */}
                                {step > 0 && (
                                    <button onClick={() => setStep(step - 1)} className="flex items-center gap-2 text-sm text-gray-500 hover:text-purple-600 dark:text-gray-400 dark:hover:text-purple-400 transition-colors">
                                        <ChevronLeft size={16} />
                                        {zh ? '回上一題' : 'Back'}
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 4.8 Settings Application
        const SettingsApp = ({ lang, setLang, theme, setTheme, username, onLogout, navigateTo }) => {
            const zh = lang === 'zh';
            const [speechRate, setSpeechRate] = useState(0.95);
            const [fontSize, setFontSize] = useState('normal');
            const [notifAnnounce, setNotifAnnounce] = useState(true);
            const [notifUpdates, setNotifUpdates] = useState(false);

            const SettingSection = ({ icon, title, children }) => (
                <div className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden mb-4">
                    <div className="flex items-center gap-2 px-5 py-3 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/40">
                        <span className="text-base">{icon}</span>
                        <h3 className="text-sm font-bold text-gray-700 dark:text-gray-200 uppercase tracking-wider">{title}</h3>
                    </div>
                    <div className="divide-y divide-gray-100 dark:divide-gray-700">{children}</div>
                </div>
            );

            const SettingRow = ({ label, sub, children }) => (
                <div className="flex items-center justify-between px-5 py-4 gap-4">
                    <div className="min-w-0">
                        <p className="text-sm font-medium text-gray-800 dark:text-gray-100">{label}</p>
                        {sub && <p className="text-xs text-gray-400 dark:text-gray-500 mt-0.5">{sub}</p>}
                    </div>
                    <div className="shrink-0">{children}</div>
                </div>
            );

            const Toggle = ({ value, onChange }) => (
                <button
                    onClick={() => onChange(!value)}
                    className={`relative inline-flex items-center w-11 h-6 rounded-full transition-colors duration-200 focus:outline-none ${value ? 'bg-[#e50010]' : 'bg-gray-300 dark:bg-gray-600'}`}
                >
                    <span className={`inline-block w-4 h-4 bg-white rounded-full shadow transform transition-transform duration-200 ${value ? 'translate-x-6' : 'translate-x-1'}`} />
                </button>
            );

            const fontSizeOptions = zh
                ? [{ v: 'small', l: '小' }, { v: 'normal', l: '標準' }, { v: 'large', l: '大' }]
                : [{ v: 'small', l: 'Small' }, { v: 'normal', l: 'Normal' }, { v: 'large', l: 'Large' }];

            const applyFontSize = (size) => {
                setFontSize(size);
                const map = { small: '13px', normal: '15px', large: '17px' };
                document.documentElement.style.fontSize = map[size];
            };

            const speechRateLabels = zh
                ? { 0.75: '慢速', 0.95: '標準', 1.2: '快速' }
                : { 0.75: 'Slow', 0.95: 'Normal', 1.2: 'Fast' };

            return (
                <div className="p-6 md:p-8 max-w-2xl mx-auto animate-in fade-in duration-300 w-full pb-12">
                    <div className="mb-6 border-b border-gray-200 dark:border-gray-700 pb-4">
                        <h2 className="text-3xl font-bold text-gray-800 dark:text-gray-100 flex items-center gap-3">
                            <Settings size={28} className="text-gray-500 dark:text-gray-400" />
                            {zh ? '系統設定' : 'Settings'}
                        </h2>
                        <p className="text-gray-500 dark:text-gray-400 mt-2 text-sm">{zh ? '自訂你的入口網站偏好設定' : 'Customise your portal experience'}</p>
                    </div>

                    {/* Account */}
                    <SettingSection icon="👤" title={zh ? '帳號資訊' : 'Account'}>
                        <SettingRow
                            label={zh ? '使用者名稱' : 'Username'}
                            sub={zh ? '目前登入的帳號' : 'Currently signed in as'}
                        >
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-full bg-[#e50010] flex items-center justify-center text-white font-bold text-sm select-none">
                                    {username ? username[0].toUpperCase() : '?'}
                                </div>
                                <span className="text-sm font-semibold text-gray-700 dark:text-gray-200">{username}</span>
                            </div>
                        </SettingRow>
                        <SettingRow
                            label={zh ? '電子郵件' : 'Email'}
                            sub={zh ? '公司帳號（唯讀）' : 'Corporate account (read-only)'}
                        >
                            <span className="text-sm text-gray-500 dark:text-gray-400">{username ? `${username.toLowerCase()}@hmgroup.com` : '—'}</span>
                        </SettingRow>
                        <SettingRow label={zh ? '登出帳號' : 'Sign Out'} sub={zh ? '結束目前的工作階段' : 'End your current session'}>
                            <button
                                onClick={onLogout}
                                className="px-4 py-1.5 bg-red-50 dark:bg-red-900/20 text-[#e50010] dark:text-red-400 border border-red-200 dark:border-red-800 rounded-lg text-sm font-semibold hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors"
                            >
                                {zh ? '登出' : 'Sign Out'}

                    {/* Appearance */}

                        <SettingRow
                            label={zh ? '色彩主題' : 'Colour Theme'}

                        >

                                    u.lang = zh ? 'zh-TW' : 'en-US';
                                    u.rate = speechRate;

                                    <h2 className="text-2xl font-normal text-gray-800 dark:text-gray-100">{dict.home}</h2>
                                    <div className="mt-4 p-6 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700">
                                        <h3 className="text-lg font-semibold text-[#e50010] mb-2">{dict.aboutHM}</h3>
                                        <p className="text-gray-600 dark:text-gray-300 text-sm leading-relaxed">{dict.aboutText}</p>
                                    </div>
                                </div>
                                <div className="mb-8 mt-10">
                                    <h3 className="text-gray-600 dark:text-gray-400 text-sm font-semibold uppercase tracking-wider mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">{dict.myApps}</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                        {getLaunchpadTiles().map(app => (
                                            <FioriTile key={app.id} app={app} onClick={(appData) => navigateTo('app', appData)} onCareerWizard={() => navigateTo('career-wizard')} dict={dict} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {currentView === 'career-wizard' && (
                            <div className="animate-in slide-in-from-right-4 duration-300 ease-out h-full">
                                <CareerWizardApp dict={dict} lang={lang} navigateTo={navigateTo} />
                            </div>
                        )}

                        {currentView === 'settings' && (
                            <div className="animate-in slide-in-from-right-4 duration-300 ease-out h-full">
                                <SettingsApp
                                    lang={lang} setLang={setLang}
                                    theme={theme} setTheme={setTheme}
                                    username={loginForm.username}
                                    onLogout={() => { setIsLoggedIn(false); setLoginForm({ username: '', password: '' }); }}
                                    navigateTo={navigateTo}
                                />
                            </div>
                        )}

                        {currentView === 'help' && (
                            <div className="animate-in slide-in-from-right-4 duration-300 ease-out h-full overflow-y-auto">
                                <HelpSupportApp lang={lang} navigateTo={navigateTo} />
                            </div>
                        )}

                        {currentView === 'app' && selectedApp && (
                            <div className="animate-in slide-in-from-right-4 duration-300 ease-out h-full">
                                {selectedApp.id === 'team' ? (
                                    <div><TeamIntroApp appData={selectedApp} dict={dict} lang={lang} /><div className="px-6 md:px-8 max-w-5xl mx-auto"><SectionNav currentId="team" lang={lang} navigateTo={navigateTo} getLaunchpadTiles={getLaunchpadTiles} /></div></div>
                                ) : selectedApp.id === 'history' ? (
                                    <div><CompanyHistoryApp appData={selectedApp} dict={dict} lang={lang} /><div className="px-6 md:px-8 max-w-5xl mx-auto"><SectionNav currentId="history" lang={lang} navigateTo={navigateTo} getLaunchpadTiles={getLaunchpadTiles} /></div></div>
                                ) : selectedApp.id === 'finance' ? (
                                    <div><FinancialInfoApp appData={selectedApp} dict={dict} lang={lang} /><div className="px-6 md:px-8 max-w-5xl mx-auto"><SectionNav currentId="finance" lang={lang} navigateTo={navigateTo} getLaunchpadTiles={getLaunchpadTiles} /></div></div>
                                ) : selectedApp.id === 'structure' ? (
                                    <div><OrgStructureApp appData={selectedApp} dict={dict} lang={lang} /><div className="px-6 md:px-8 max-w-5xl mx-auto"><SectionNav currentId="structure" lang={lang} navigateTo={navigateTo} getLaunchpadTiles={getLaunchpadTiles} /></div></div>
                                ) : selectedApp.id === 'jobs' ? (
                                    <div><JobOpeningsApp appData={selectedApp} dict={dict} lang={lang} /><div className="px-6 md:px-8 max-w-5xl mx-auto"><SectionNav currentId="jobs" lang={lang} navigateTo={navigateTo} getLaunchpadTiles={getLaunchpadTiles} /></div></div>
                                ) : selectedApp.id === 'terminology' ? (
                                    <div><TerminologyApp appData={selectedApp} dict={dict} lang={lang} /><div className="px-6 md:px-8 max-w-5xl mx-auto"><SectionNav currentId="terminology" lang={lang} navigateTo={navigateTo} getLaunchpadTiles={getLaunchpadTiles} /></div></div>
                                ) : selectedApp.id === 'ai' ? (
                                    <div><AIUtilizationApp appData={selectedApp} dict={dict} lang={lang} /><div className="px-6 md:px-8 max-w-5xl mx-auto"><SectionNav currentId="ai" lang={lang} navigateTo={navigateTo} getLaunchpadTiles={getLaunchpadTiles} /></div></div>
                                ) : selectedApp.type === 'master-detail' ? (
                                    <MasterDetailApp appData={selectedApp} dict={dict} lang={lang} />
                                ) : (
                                    <div className="p-8 text-center mt-20">
                                        <div className="inline-flex items-center justify-center w-20 h-20 bg-white dark:bg-gray-800 rounded-full shadow-md mb-6 text-[#e50010] dark:text-red-400">
                                            {React.createElement(selectedApp.icon, { size: 40 })}
                                        </div>
                                        <h2 className="text-2xl font-semibold text-gray-800 dark:text-gray-100">{selectedApp.title}</h2>
                                        <p className="text-gray-500 dark:text-gray-400 mt-2">{dict.placeholderMsg}</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <Footer dict={dict} lang={lang} onOpenModal={setLegalModal} />
                    {legalModal && <LegalModal type={legalModal} lang={lang} onClose={() => setLegalModal(null)} />}
                </div>
            );
        }

        // ── Help & Support Application ────────────────────────────────
        const HelpSupportApp = ({ lang, navigateTo }) => {
            const zh = lang === 'zh';
            const [openFaq, setOpenFaq] = useState(null);
            const [form, setForm] = useState({ name: '', email: '', subject: '', message: '' });
            const [submitted, setSubmitted] = useState(false);

            const faqs = zh ? [
                { q: '如何切換語言？', a: '點擊頁面右上角的地球圖示（🌐），即可在中文與英文之間切換。' },
                { q: '如何切換深色模式？', a: '點擊右上角的月亮 / 太陽圖示即可切換深色模式與亮色模式。' },
                { q: '語音導覽功能如何使用？', a: '點擊右上角的喇叭圖示（🔊）即可啟動語音導覽，系統將朗讀當前頁面的內容。再次點擊可暫停，點擊停止按鈕可終止朗讀。' },
                { q: '詞彙測驗的分數是如何計算的？', a: '每次測驗隨機抽取 5 題，每答對 1 題得 1 分。測驗完成後可在「測驗紀錄」區塊查看歷史成績與正確率。' },
                { q: '如何查看各組員的聯絡信箱？', a: '前往「小組成員介紹」頁面，每位組員卡片下方皆有電子郵件連結，點擊後可直接開啟郵件應用程式。' },
                { q: '這個網站是官方 H&M 網站嗎？', a: '否，本網站為學術用途，由暨南國際大學 PMCS G4 小組製作，僅供課程專題展示之用，並非 H&M 集團的官方網站。' },
            ] : [
                { q: 'How do I switch the language?', a: 'Click the globe icon (🌐) in the top-right corner to toggle between English and Chinese.' },
                { q: 'How do I enable dark mode?', a: 'Click the moon / sun icon in the top-right corner to switch between light and dark mode.' },
                { q: 'How does the Voice Guide work?', a: 'Click the speaker icon (🔊) in the top-right corner to start the voice guide. The system will read out the current page content. Click again to pause, or use the stop button to end playback.' },
                { q: 'How is the quiz score calculated?', a: '5 random questions are drawn each time. You earn 1 point per correct answer. After completing a quiz, your history and accuracy are saved in the Quiz History panel.' },
                { q: 'How can I contact a team member?', a: 'Go to the Team Introduction page. Each member\'s card has a clickable email link at the bottom that opens your mail app directly.' },
                { q: 'Is this the official H&M website?', a: 'No. This is an academic project created by the PMCS G4 team at National Chi Nan University, for course presentation purposes only. It is not affiliated with H&M Group.' },
            ];

            const resources = [
                { label: zh ? 'H&M 集團官方網站' : 'H&M Group Official Website', url: 'https://www2.hm.com/en_us/index.html', desc: zh ? '投資人關係、品牌資訊與永續發展報告' : 'Investor relations, brand info & sustainability', icon: '🌐' },
                { label: zh ? 'H&M 品牌官網' : 'H&M Brand Website', url: 'https://www2.hm.com/en_us/index.html', desc: zh ? '商品瀏覽、線上購物與門市資訊' : 'Shop online, browse products & find stores', icon: '🛍️' },
                { label: zh ? 'H&M 職涯招募頁面' : 'H&M Careers Page', url: 'https://career.hm.com', desc: zh ? '搜尋全球職缺並加入人才社群' : 'Search global openings & join the talent community', icon: '💼' },
                { label: zh ? 'H&M 年度報告（2025）' : 'H&M Annual Report 2025', url: 'https://hmgroup.com/investors/reports-and-presentations/annual-reports/', desc: zh ? '最新財務數據與永續發展進度' : 'Latest financials & sustainability progress', icon: '📄' },
                { label: zh ? '暨南國際大學國際企業學系' : 'NCNU Dept. of International Business', url: 'https://ibs.ncnu.edu.tw', desc: zh ? '本專題指導教授所屬單位' : 'Home department of the project advisor', icon: '🎓' },
                { label: zh ? '指導教授 駱世民 博士' : 'Advisor: Prof. Shih-Min Lo', url: 'mailto:smlo@ncnu.edu.tw', desc: zh ? '電子郵件：smlo@ncnu.edu.tw' : 'Email: smlo@ncnu.edu.tw', icon: '👨‍🏫' },
            ];

            const teamContacts = [
                { name: 'Zoe',     email: 's113251013@mail1.ncnu.edu.tw', role: zh ? '管理學院學士班' : 'College of Management' },
                { name: 'Jenifer', email: 's113212044@mail1.ncnu.edu.tw', role: zh ? '國際企業學系' : 'International Business' },
                { name: 'Andy',    email: 's114400003@mail1.ncnu.edu.tw', role: zh ? '諮商心理與人力資源發展學系' : 'Counseling Psychology & HRD' },
                { name: 'Jessica', email: 's111101002@mail1.ncnu.edu.tw', role: zh ? '中國語文學系' : 'Chinese Literature' },
                { name: 'Diana',   email: 's111212029@mail1.ncnu.edu.tw', role: zh ? '國際企業學系' : 'International Business' },
            ];

            const handleSubmit = () => {
                if (!form.name.trim() || !form.email.trim() || !form.message.trim()) return;
                const mailto = `mailto:s111212029@mail1.ncnu.edu.tw?subject=${encodeURIComponent(form.subject || (zh ? '來自 H&M 入口網站的訊息' : 'Message from H&M Portal'))}&body=${encodeURIComponent(`Name: ${form.name}\nEmail: ${form.email}\n\n${form.message}`)}`;
                window.location.href = mailto;
                setSubmitted(true);
            };

            return (
                <div className="p-6 md:p-8 max-w-5xl mx-auto animate-in fade-in duration-300 w-full pb-16">
                    {/* Header */}
                    <div className="mb-8 border-b border-gray-200 dark:border-gray-700 pb-4">
                        <h2 className="text-3xl font-bold text-gray-800 dark:text-gray-100 flex items-center gap-3">
                            <span className="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-[#e50010] text-white shrink-0">
                                <Icon name="HelpCircle" size={22} />
                            </span>
                            {zh ? '說明與支援' : 'Help & Support'}
                        </h2>
                        <p className="text-gray-500 dark:text-gray-400 mt-2 text-sm">
                            {zh ? '找到您需要的答案，或直接與我們的團隊聯繫。' : 'Find answers to common questions, or reach out to our team directly.'}

                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Left column: FAQ + Resources */}

                                    <span className="text-lg">❓</span>
                                    <h3 className="font-bold text-gray-800 dark:text-gray-100">{zh ? '常見問題' : 'Frequently Asked Questions'}</h3>

                                <div className="divide-y divide-gray-100 dark:divide-gray-700">

                                                onClick={() => setOpenFaq(openFaq === i ? null : i)}
                                                className="w-full flex items-center justify-between px-6 py-4 text-left hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors"
                                            >
                                                <span className="text-sm font-semibold text-gray-700 dark:text-gray-200 pr-4">{faq.q}</span>
                                                <span className={`shrink-0 transition-transform duration-200 text-gray-400 ${openFaq === i ? 'rotate-180' : ''}`}>
                                                    <Icon name="ChevronDown" size={16} />
                                                </span>
                                            </button>
                                            {openFaq === i && (
                                                <div className="px-6 pb-4 text-sm text-gray-600 dark:text-gray-300 leading-relaxed bg-gray-50 dark:bg-gray-700/30">
                                                    {faq.a}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Resources */}
                            <div className="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
                                <div className="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center gap-2">
                                    <span className="text-lg">🔗</span>
                                    <h3 className="font-bold text-gray-800 dark:text-gray-100">{zh ? '相關資源連結' : 'Useful Links & Resources'}</h3>
                                </div>
                                <div className="p-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {resources.map((r, i) => (
                                        <a key={i} href={r.url} target="_blank" rel="noopener noreferrer"
                                            className="flex items-start gap-3 p-3 rounded-lg border border-gray-100 dark:border-gray-700 hover:border-[#e50010] dark:hover:border-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 transition-all group">
                                            <span className="text-2xl shrink-0 mt-0.5">{r.icon}</span>
                                            <div className="overflow-hidden">
                                                <p className="text-sm font-semibold text-gray-800 dark:text-gray-100 group-hover:text-[#e50010] dark:group-hover:text-red-400 transition-colors truncate">{r.label}</p>
                                                <p className="text-xs text-gray-500 dark:text-gray-400 mt-0.5 leading-snug">{r.desc}</p>
                                            </div>
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Right column: Contact Form + Team Contacts */}
                        <div className="space-y-6">
                            {/* Contact Form */}
                            <div className="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
                                <div className="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center gap-2">
                                    <span className="text-lg">✉️</span>
                                    <h3 className="font-bold text-gray-800 dark:text-gray-100">{zh ? '聯絡我們' : 'Contact Us'}</h3>
                                </div>
                                {submitted ? (
                                    <div className="p-6 text-center">
                                        <div className="text-4xl mb-3">✅</div>
                                        <p className="font-semibold text-gray-800 dark:text-gray-100 text-sm">{zh ? '訊息已準備完成！' : 'Message ready!'}</p>
                                        <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">{zh ? '您的郵件應用程式應已開啟。' : 'Your mail app should have opened.'}</p>
                                        <button onClick={() => { setSubmitted(false); setForm({ name: '', email: '', subject: '', message: '' }); }}
                                            className="mt-4 text-xs text-[#e50010] hover:underline">
                                            {zh ? '再次發送' : 'Send another'}
                                        </button>
                                    </div>
                                ) : (
                                    <div className="p-5 space-y-3">
                                        {[
                                            { key: 'name',    label: zh ? '您的姓名 *' : 'Your Name *',    type: 'text',  placeholder: zh ? '請輸入姓名' : 'Enter your name' },
                                            { key: 'email',   label: zh ? '電子郵件 *' : 'Email *',         type: 'email', placeholder: zh ? '請輸入信箱' : 'Enter your email' },
                                            { key: 'subject', label: zh ? '主旨' : 'Subject',               type: 'text',  placeholder: zh ? '訊息主旨（選填）' : 'Message subject (optional)' },
                                        ].map(f => (
                                            <div key={f.key}>
                                                <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">{f.label}</label>
                                                <input
                                                    type={f.type}
                                                    value={form[f.key]}
                                                    onChange={e => setForm(prev => ({ ...prev, [f.key]: e.target.value }))}
                                                    placeholder={f.placeholder}
                                                    className="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#e50010] focus:border-transparent transition"
                                                />
                                            </div>
                                        ))}
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">{zh ? '訊息內容 *' : 'Message *'}</label>
                                            <textarea
                                                rows={4}
                                                value={form.message}
                                                onChange={e => setForm(prev => ({ ...prev, message: e.target.value }))}
                                                placeholder={zh ? '請輸入您的訊息…' : 'Write your message…'}
                                                className="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#e50010] focus:border-transparent transition resize-none"
                                            />
                                        </div>
                                        <button
                                            onClick={handleSubmit}
                                            disabled={!form.name.trim() || !form.email.trim() || !form.message.trim()}
                                            className="w-full py-2.5 bg-[#e50010] hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-lg transition-colors"
                                        >
                                            {zh ? '傳送訊息 →' : 'Send Message →'}
                                        </button>
                                        <p className="text-xs text-gray-400 dark:text-gray-500 text-center">{zh ? '點擊後將開啟您的郵件應用程式。' : 'Clicking will open your mail app.'}</p>
                                    </div>
                                )}
                            </div>

                            {/* Team Contacts */}
                            <div className="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
                                <div className="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex items-center gap-2">
                                    <span className="text-lg">👥</span>
                                    <h3 className="font-bold text-gray-800 dark:text-gray-100">{zh ? '團隊聯絡方式' : 'Team Contacts'}</h3>
                                </div>
                                <div className="divide-y divide-gray-100 dark:divide-gray-700">
                                    {teamContacts.map((c, i) => (
                                        <a key={i} href={`mailto:${c.email}`}
                                            className="flex items-center gap-3 px-5 py-3 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors group">
                                            <div className="w-8 h-8 rounded-full bg-[#e50010]/10 dark:bg-red-900/30 flex items-center justify-center text-[#e50010] dark:text-red-400 font-bold text-sm shrink-0">
                                                {c.name[0]}
                                            </div>
                                            <div className="overflow-hidden">
                                                <p className="text-sm font-semibold text-gray-800 dark:text-gray-100 group-hover:text-[#e50010] dark:group-hover:text-red-400 transition-colors">{c.name}</p>
                                                <p className="text-xs text-gray-400 dark:text-gray-500 truncate">{c.email}</p>
                                            </div>
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
